name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app_simplified/requirements.txt
          pip install pytest httpx

      - name: Compile Python files
        run: |
          python -m compileall app_simplified demo_minimal_pinn.py demo_pinn_with_discovery.py tests

      - name: Run tests
        run: |
          pytest -q
